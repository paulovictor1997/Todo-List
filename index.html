<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <link rel="stylesheet" href="assets/estilo/estilo.css">
    <link rel="shortcut icon" href="assets/img/Icons8-Windows-8-Data-List.ico">
    <link rel="stylesheet" href="https://pro.fontawesome.com/releases/v5.10.0/css/all.css" integrity="sha384-AYmEC3Yw5cVb3ZcuHtOA93w35dYTsvhLPVnYs9eStHfGJvOvKxVfELGroGkvsg+p" crossorigin="anonymous"/>
</head>
<body>
    <main class="container">
        <header class="app-header">
            <h1>Todo List</h1>
            <div class="toggle">
                <input id="switch" type="checkbox" name="theme">
                <label for="switch">
                    <span class="visually-hidden">Alternar tema claro/escuro</span>
                </label>
            </div>
        </header>

        <form class="todo-form" onsubmit="return false">
            <label for="todo-input" class="visually-hidden">Nova tarefa</label>
            <input id="todo-input" type="text" class="todo-input" placeholder="O que você precisa fazer?" autocomplete="off" />
            <button type="submit" class="todo-button" aria-label="Adicionar tarefa">
                <i class="fas fa-plus-square"></i>
            </button>

            <div class="select">
                <label for="filter-todo" class="visually-hidden">Filtrar tarefas</label>
                <select id="filter-todo" name="todos" class="filter-todo">
                    <option value="all">Todos</option>
                    <option value="completed">Completos</option>
                    <option value="uncompleted">Incompletos</option>
                </select>
            </div>
        </form>

        <div class="todo-container">
            <ul class="todo-list" aria-live="polite"></ul>
        </div>
    </main>
</body>
<script src="assets/JS/script.js"></script>
</html>
